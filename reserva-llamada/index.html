<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <meta name="theme-color" content="#0284c7" />
    <title>Reservar llamada · Delfín Check-in</title>
    <meta
      name="description"
      content="Reserva una llamada de 15 minutos con el equipo de Delfín Check-in. Lunes a viernes, hora de Madrid."
    />
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        --sky: #0284c7;
        --sky-dark: #0369a1;
        --ink: #0f172a;
        --muted: #475569;
        --line: #e2e8f0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(900px 500px at 10% 0%, #e0f2fe 0%, transparent 55%),
          linear-gradient(180deg, #f0f9ff 0%, #fff 45%, #f8fafc 100%);
      }
      .wrap { max-width: 640px; margin: 0 auto; padding: 40px 18px 64px; }
      .brand { font-size: 18px; font-weight: 800; color: var(--sky); margin: 0 0 22px; }
      .card {
        background: #fff;
        border: 1px solid #e0f2fe;
        border-radius: 18px;
        padding: 26px 22px;
        box-shadow: 0 18px 40px rgba(2, 132, 199, 0.08);
      }
      h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.2; }
      .lead { margin: 0 0 18px; color: var(--muted); line-height: 1.55; font-size: 15px; }
      .eyebrow { margin: 0 0 8px; font-size: 13px; font-weight: 700; color: var(--sky); }
      .label { display: block; font-size: 13px; font-weight: 700; margin: 0 0 8px; }
      .req { color: #be123c; }
      .slots { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
      @media (min-width: 520px) { .slots { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
      button.slot {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 650;
        cursor: pointer;
        color: var(--ink);
      }
      button.slot.active { background: var(--sky); border-color: var(--sky); color: #fff; }
      button.slot:hover { border-color: #7dd3fc; }
      .cal-nav {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; margin-bottom: 10px;
      }
      .cal-nav button {
        border: 1px solid var(--line); background: #fff; border-radius: 10px;
        padding: 8px 12px; font-weight: 700; cursor: pointer; color: var(--ink);
      }
      .cal-nav button:disabled { opacity: 0.35; cursor: not-allowed; }
      .cal-title { font-size: 15px; font-weight: 800; text-transform: capitalize; }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 18px;
      }
      .cal-dow {
        text-align: center; font-size: 11px; font-weight: 700; color: #64748b;
        padding: 4px 0;
      }
      button.day {
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 12px;
        min-height: 44px;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;
        color: var(--ink);
      }
      button.day:disabled {
        opacity: 0.28; cursor: not-allowed; background: #f8fafc; color: #94a3b8;
      }
      button.day.active { background: var(--sky); border-color: var(--sky); color: #fff; }
      button.day.has-slots:not(.active):not(:disabled) { border-color: #7dd3fc; }
      .field { margin-bottom: 14px; }
      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 16px;
        font-family: inherit;
      }
      input:invalid:not(:placeholder-shown), textarea:invalid:not(:placeholder-shown) {
        border-color: #fda4af;
      }
      textarea { min-height: 96px; resize: vertical; }
      .hint { margin: 6px 0 0; font-size: 12px; color: #64748b; line-height: 1.45; }
      .cta {
        width: 100%; border: 0; border-radius: 12px; background: var(--sky);
        color: #fff; font-weight: 750; font-size: 16px; padding: 14px 16px; cursor: pointer;
      }
      .cta:disabled { opacity: 0.5; cursor: not-allowed; }
      .cta:hover:not(:disabled) { background: var(--sky-dark); }
      .note { margin: 12px 0 0; font-size: 12px; color: #64748b; line-height: 1.5; }
      .banner {
        background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
        padding: 10px 12px; color: #92400e; margin-bottom: 16px; font-size: 13px; line-height: 1.45;
      }
      .err {
        margin-top: 14px; padding: 10px 12px; border-radius: 12px;
        background: #fff1f2; border: 1px solid #fecdd3; color: #be123c; font-size: 14px;
      }
      .ok-title { font-size: 24px; margin: 8px 0 12px; }
      .muted { color: var(--muted); font-size: 14px; line-height: 1.55; }
      a.btn {
        display: inline-flex; justify-content: center; align-items: center;
        width: 100%; margin-top: 14px; text-decoration: none;
        background: var(--sky); color: #fff; font-weight: 750;
        border-radius: 12px; padding: 14px 16px;
      }
      .home { display: inline-block; margin-top: 18px; color: var(--sky); font-size: 14px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="brand">Delfín Check-in</p>
      <div class="card" id="app">
        <p class="muted">Cargando calendario…</p>
      </div>
      <a class="home" href="/">← Volver a delfincheckin.com</a>
    </div>
    <script>
(function () {
  var API = 'https://admin.delfincheckin.com/api/public/sales-calls';
  var params = new URLSearchParams(location.search);
  var initialEmail = (params.get('email') || '').trim().toLowerCase();
  var source = (params.get('src') || 'web_landing').trim() || 'web_landing';
  var app = document.getElementById('app');
  var MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  var state = {
    byKey: {},
    windows: '',
    note: '',
    viewYear: 0,
    viewMonth: 0, // 0-11
    minKey: '',
    maxKey: '',
    selectedDay: '',
    selectedSlot: null,
    name: '',
    email: initialEmail,
    phone: '',
    comments: '',
    error: '',
    pending: false,
    done: null
  };

  function esc(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function pad(n) { return String(n).padStart(2, '0'); }
  function keyFromYMD(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function parseKey(k) {
    var p = k.split('-').map(Number);
    return { y: p[0], m: p[1] - 1, d: p[2] };
  }
  function weekdayMon0(y, m, d) {
    // 0=Mon … 4=Fri … 6=Sun
    var wd = new Date(Date.UTC(y, m, d, 12, 0, 0)).getUTCDay();
    return (wd + 6) % 7;
  }

  function canGoPrev() {
    if (!state.minKey) return false;
    var min = parseKey(state.minKey);
    return state.viewYear > min.y || (state.viewYear === min.y && state.viewMonth > min.m);
  }
  function canGoNext() {
    if (!state.maxKey) return false;
    var max = parseKey(state.maxKey);
    return state.viewYear < max.y || (state.viewYear === max.y && state.viewMonth < max.m);
  }

  function renderCalendar() {
    var y = state.viewYear;
    var m = state.viewMonth;
    var daysInMonth = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    var html = '<div class="cal-nav">' +
      '<button type="button" id="prevMonth" ' + (canGoPrev() ? '' : 'disabled') + '>←</button>' +
      '<div class="cal-title">' + MONTHS[m] + ' ' + y + '</div>' +
      '<button type="button" id="nextMonth" ' + (canGoNext() ? '' : 'disabled') + '>→</button>' +
      '</div>';
    html += '<div class="cal-grid">' +
      '<div class="cal-dow">L</div><div class="cal-dow">M</div><div class="cal-dow">X</div><div class="cal-dow">J</div><div class="cal-dow">V</div>';

    // Find first Mon-Fri cell offset for day 1
    var firstWd = weekdayMon0(y, m, 1);
    // Skip weekend starts by advancing empty cells only for Mon-Fri grid:
    // If month starts Sat(5)/Sun(6), first weekday cell is empty until Mon.
    var lead = firstWd <= 4 ? firstWd : 0;
    if (firstWd === 5 || firstWd === 6) lead = 0; // weekend start → first cell is next Mon which is still day>1
    // Better: iterate all days, only emit Mon-Fri buttons; insert blanks for alignment
    var emitted = false;
    for (var day = 1; day <= daysInMonth; day++) {
      var wd = weekdayMon0(y, m, day);
      if (wd > 4) continue; // weekend
      if (!emitted) {
        for (var b = 0; b < wd; b++) html += '<div></div>';
        emitted = true;
      }
      var key = keyFromYMD(y, m, day);
      var info = state.byKey[key];
      var has = !!(info && info.slots && info.slots.length);
      var active = state.selectedDay === key;
      html += '<button type="button" class="day' + (active ? ' active' : '') + (has ? ' has-slots' : '') + '" data-day="' + esc(key) + '" ' + (has ? '' : 'disabled') + '>' + day + '</button>';
    }
    html += '</div>';
    return html;
  }

  function render() {
    if (state.done) {
      var d = state.done;
      var meet = d.meetingUrl && d.meetingUrl.indexOf('Te enviaremos') !== 0
        ? '<a class="btn" href="' + esc(d.meetingUrl) + '" target="_blank" rel="noopener">Abrir videollamada</a>'
        : '';
      app.innerHTML =
        '<p class="eyebrow">Reserva confirmada</p>' +
        '<h1 class="ok-title">' + esc(d.dateLabel) + ' · ' + esc(d.timeLabel) + '</h1>' +
        '<p class="muted">Llamada de <strong>15 minutos</strong> (Madrid). Es puntual: empezamos a la hora en punto.</p>' +
        '<p class="muted">Te hemos enviado un <strong>email de confirmación</strong> a <strong>' + esc(state.email) + '</strong> con Zoom y cómo cambiar/cancelar. Una hora antes recibirás un recordatorio.</p>' +
        meet;
      return;
    }

    var day = state.byKey[state.selectedDay];
    var slots = (day && day.slots) || [];
    var slotsHtml = slots.length
      ? slots.map(function (s) {
          return '<button type="button" class="slot' + (state.selectedSlot && state.selectedSlot.startAt === s.startAt ? ' active' : '') + '" data-start="' + esc(s.startAt) + '">' + esc(s.timeLabel) + '</button>';
        }).join('')
      : '<p class="muted">Elige un día con huecos libres (L–V).</p>';

    var dayLabel = day ? day.dateLabel : '—';

    app.innerHTML =
      '<p class="eyebrow">Equipo comercial</p>' +
      '<h1>Reserva una llamada de 15 min</h1>' +
      '<p class="lead">Te enseñamos Delfín Check-in en una videollamada corta. Horario: <strong>lunes a viernes</strong>, ' +
      esc(state.windows || '09:00–14:00 y 16:00–19:00') +
      ' (Madrid). Entre citas dejamos 30 min de margen.</p>' +
      (state.note ? '<p class="banner">' + esc(state.note) + '</p>' : '') +
      '<div><span class="label">Día (calendario L–V)</span>' + renderCalendar() + '</div>' +
      '<div><span class="label">Hora · ' + esc(dayLabel) + ' (15 min · puntual)</span><div class="slots">' + slotsHtml + '</div></div>' +
      '<div class="field"><label class="label" for="name">Nombre <span class="req">*</span></label>' +
      '<input id="name" required placeholder="Tu nombre" value="' + esc(state.name) + '" autocomplete="name" /></div>' +
      '<div class="field"><label class="label" for="email">Email <span class="req">*</span></label>' +
      '<input id="email" type="email" required placeholder="tu@email.com" value="' + esc(state.email) + '" autocomplete="email" />' +
      '<p class="hint">Obligatorio: aquí enviamos la confirmación y el recordatorio 1 h antes.</p></div>' +
      '<div class="field"><label class="label" for="phone">Teléfono (opcional)</label>' +
      '<input id="phone" value="' + esc(state.phone) + '" autocomplete="tel" /></div>' +
      '<div class="field"><label class="label" for="comments">¿Qué te gustaría resolver en la llamada?</label>' +
      '<textarea id="comments" placeholder="Ej.: nº de viviendas, Airbnb/Booking, dudas SES Hospedajes, si quieres ver el panel en directo…">' + esc(state.comments) + '</textarea>' +
      '<p class="hint">Opcional, pero ayuda: lo leemos antes de la llamada (también llega a nuestro equipo).</p></div>' +
      '<button class="cta" id="submit" ' + (state.pending || !state.selectedSlot ? 'disabled' : '') + '>' +
      (state.pending ? 'Reservando…' : 'Confirmar llamada de 15 min') +
      '</button>' +
      '<p class="note">Importante: la hora es fija. Si llegas tarde puede que hayamos pasado a la siguiente cita.</p>' +
      (state.error ? '<p class="err">' + esc(state.error) + '</p>' : '');

    var prev = document.getElementById('prevMonth');
    var next = document.getElementById('nextMonth');
    if (prev) prev.addEventListener('click', function () {
      if (!canGoPrev()) return;
      if (state.viewMonth === 0) { state.viewMonth = 11; state.viewYear -= 1; }
      else state.viewMonth -= 1;
      render();
    });
    if (next) next.addEventListener('click', function () {
      if (!canGoNext()) return;
      if (state.viewMonth === 11) { state.viewMonth = 0; state.viewYear += 1; }
      else state.viewMonth += 1;
      render();
    });

    app.querySelectorAll('[data-day]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.selectedDay = btn.getAttribute('data-day');
        state.selectedSlot = null;
        render();
      });
    });
    app.querySelectorAll('[data-start]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var start = btn.getAttribute('data-start');
        var found = slots.find(function (s) { return s.startAt === start; });
        state.selectedSlot = found || null;
        render();
      });
    });
    ['name', 'email', 'phone', 'comments'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('input', function () { state[id] = el.value; });
    });
    var submit = document.getElementById('submit');
    if (submit) submit.addEventListener('click', book);
  }

  function book() {
    if (!state.selectedSlot || state.pending) return;
    state.name = ((document.getElementById('name') || {}).value || state.name).trim();
    state.email = ((document.getElementById('email') || {}).value || state.email).trim().toLowerCase();
    state.phone = ((document.getElementById('phone') || {}).value || state.phone).trim();
    state.comments = ((document.getElementById('comments') || {}).value || state.comments).trim();

    if (state.name.length < 2) {
      state.error = 'El nombre es obligatorio.';
      render();
      return;
    }
    if (!state.email || state.email.indexOf('@') < 1) {
      state.error = 'El email es obligatorio (para confirmación y recordatorio).';
      render();
      return;
    }

    state.pending = true;
    state.error = '';
    render();
    fetch(API + '/book', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        startAt: state.selectedSlot.startAt,
        name: state.name,
        email: state.email,
        phone: state.phone,
        comments: state.comments,
        source: source
      })
    })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        state.pending = false;
        if (!res.ok || !res.j.success) {
          state.error = (res.j && res.j.error) || 'No se pudo reservar';
          render();
          return;
        }
        state.done = res.j.booking;
        render();
      })
      .catch(function () {
        state.pending = false;
        state.error = 'Error de red al reservar. Inténtalo de nuevo.';
        render();
      });
  }

  fetch(API + '/availability', { cache: 'no-store', headers: { Accept: 'application/json' } })
    .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
    .then(function (res) {
      if (!res.ok || !res.j.success) throw new Error((res.j && res.j.error) || 'Error al cargar');
      var list = res.j.days || [];
      state.byKey = {};
      list.forEach(function (d) { state.byKey[d.dateKey] = d; });
      state.windows = res.j.windows || '';
      state.note = res.j.note || '';
      if (list.length) {
        state.minKey = list[0].dateKey;
        state.maxKey = list[list.length - 1].dateKey;
        state.selectedDay = list[0].dateKey;
        var p = parseKey(list[0].dateKey);
        state.viewYear = p.y;
        state.viewMonth = p.m;
      } else {
        var now = new Date();
        state.viewYear = now.getFullYear();
        state.viewMonth = now.getMonth();
      }
      render();
    })
    .catch(function (e) {
      app.innerHTML = '<p class="err">' + esc(e.message || 'Error al cargar el calendario') + '</p>';
    });
})();
    </script>
  </body>
</html>
